[project]
name = "theremin"
version = "0.1.0"
description = "Experimental two-sensor sonar theremin"
requires-python = ">=3.11"
dependencies = [
    "dearpygui>=2.1.1",
    "numpy>=2.0",
    "sounddevice>=0.5.0",
    "pyserial>=3.5",
]

[project.scripts]
theremin = "theremin.__main__:main"
sampler = "theremin.sampler_app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
